<script>
// Busca e renderiza as medicações prescritas
function carregarMedicacoesPrescritas() {
  const div = document.getElementById("listaMedicacoes");
  if (!div) return;

  fetch("/medicacoes", {
    headers: { "Accept": "application/json" }
  })
    .then(r => {
      if (!r.ok) throw new Error("Falha na requisição");
      return r.json();
    })
    .then(data => {
      div.innerHTML = "";

      if (!data || data.length === 0) {
        div.innerHTML = "<p class='empty-msg'>Nenhuma medicação prescrita no momento.</p>";
        return;
      }

      data.forEach((c) => {
        const jsonStr = encodeURIComponent(JSON.stringify(c));
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente || "Paciente sem nome"}</h3>
            <p><b>Medicação:</b> ${c.medicacao || "Não informada"}</p>
            <p><b>Diagnóstico:</b> ${c.diagnostico || "Não informado"}</p>
            <p><b>Observações:</b> ${c.obs || "Nenhuma"}</p>
            <div>
              <button class="btn btn-receita" onclick="gerarReceitaPDF('${jsonStr}')">
                📜 Gerar Receita (PDF)
              </button>
            </div>
          </div>
        `;
      });
    })
    .catch((err) => {
      console.error("Erro medicações:", err);
      div.innerHTML = "<p class='empty-msg'>Erro ao carregar medicações.</p>";
    });
}

// Busca e renderiza os pacientes na fila de espera
function carregarFilaEspera() {
  const div = document.getElementById("listaFilaEspera");
  if (!div) return;

  fetch("/triagens", {
    headers: { "Accept": "application/json" }
  })
    .then(r => {
      if (!r.ok) throw new Error("Falha na requisição");
      return r.json();
    })
    .then(data => {
      div.innerHTML = "";

      if (!data || data.length === 0) {
        div.innerHTML = "<p class='empty-msg'>Nenhum paciente na fila de espera.</p>";
        return;
      }

      data.forEach(t => {
        const riscoClass = (t.risco || 'verde').toLowerCase();
        div.innerHTML += `
          <div class="card">
            <div>
              <span class="badge-risco ${riscoClass}">${t.risco || 'Verde'}</span>
              <strong>${t.nome || "Paciente"}</strong>
            </div>
            <p><b>Sintoma:</b> ${t.sintoma || 'Não informado'}</p>
            <button class="btn btn-chamar" onclick="chamarPaciente('${t.nome}')">
              📢 Chamar Paciente
            </button>
          </div>
        `;
      });
    })
    .catch((err) => {
      console.error("Erro fila:", err);
      div.innerHTML = "<p class='empty-msg'>Erro ao carregar fila.</p>";
    });
}

// Função para chamar o paciente na TV
function chamarPaciente(nome) {
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "CONSULTÓRIO",
      localNumero: "01",
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => alert(`✅ ${nome} foi chamado para o atendimento!`))
  .catch(() => alert("❌ Erro ao chamar o paciente."));
}

// Gera o arquivo PDF da Receita Médica
function gerarReceitaPDF(dadosEncoded) {
  try {
    const c = JSON.parse(decodeURIComponent(dadosEncoded));
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const dataHoje = new Date().toLocaleDateString('pt-BR');

    // Cabeçalho
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("VG SALVA VIDAS - RECEITA MÉDICA", 105, 20, { align: "center" });

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text(`Data de Emissão: ${dataHoje}`, 105, 27, { align: "center" });

    doc.setLineWidth(0.5);
    doc.line(20, 32, 190, 32);

    // Paciente
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.text("Paciente:", 20, 42);
    doc.setFont("helvetica", "normal");
    doc.text(c.paciente || "Não informado", 45, 42);

    // Diagnóstico
    if (c.diagnostico) {
      doc.setFont("helvetica", "bold");
      doc.text("Diagnóstico:", 20, 52);
      doc.setFont("helvetica", "normal");
      doc.text(c.diagnostico, 50, 52);
    }

    // Linha divisória
    doc.setLineWidth(0.2);
    doc.line(20, 58, 190, 58);

    // Prescrição
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("Uso / Prescrição Médica:", 20, 70);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text(c.medicacao || "Nenhuma", 25, 82, { maxWidth: 165 });

    // Orientações / Observações
    if (c.obs) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text("Instruções de Uso / Observações:", 20, 105);
      doc.setFont("helvetica", "normal");
      doc.text(c.obs, 20, 113, { maxWidth: 170 });
    }

    // Rodapé e Assinatura
    doc.line(60, 180, 150, 180);
    doc.setFontSize(10);
    doc.text("Assinatura e Carimbo do Médico(a)", 105, 186, { align: "center" });

    const nomeArquivo = (c.paciente || "Paciente").replace(/\s+/g, '_');
    doc.save(`Receita_${nomeArquivo}.pdf`);
  } catch (err) {
    alert("Erro ao gerar PDF da receita.");
    console.error(err);
  }
}

// Inicialização segura no carregamento da página
document.addEventListener("DOMContentLoaded", () => {
  carregarMedicacoesPrescritas();
  carregarFilaEspera();
  setInterval(carregarFilaEspera, 10000);
});
</script>
